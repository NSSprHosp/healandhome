<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Heal&Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Supabase Client JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

    :root {
      --primary-color: #27ae60;
      --secondary-color: #50e3c2;
      --gprimary-color: #eafaf1;
      --gsecondary-color: #f8f9f9;      
      --background-color: #f4f7f6;
      --text-color: #333;
      --card-bg: #ffffff;
      --error-color: #d0021b;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(135deg, var(--gprimary-color), var(--gsecondary-color));      
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: var(--text-color);
    }

    .login-container {
      background: var(--card-bg);
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header { margin-bottom: 30px; }
    .login-header i { font-size: 50px; color: var(--primary-color); margin-bottom: 10px; }
    .login-header h2 { margin: 0; font-weight: 600; font-size: 24px; }

    .input-group { position: relative; margin-bottom: 25px; }
    .input-group i {
      position: absolute; left: 15px; top: 50%;
      transform: translateY(-50%); color: #aaa; transition: color 0.3s;
    }
    .input-field {
      width: 100%; padding: 12px 15px 12px 45px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 16px; box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-field:focus {
      outline: none; border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }
    .input-field:focus + i { color: var(--primary-color); }

    .btn-login {
      width: 100%; padding: 14px;
      background: var(--primary-color); border: none;
      border-radius: 8px; color: white;
      font-size: 18px; font-weight: 500;
      cursor: pointer; transition: background 0.3s, transform 0.2s;
      display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    .btn-login:hover { background: #196f3d; transform: translateY(-2px); }
    .btn-login:disabled { background-color: #5edc93; cursor: not-allowed; }

    #error-message {
      color: var(--error-color); margin-top: 15px;
      height: 20px; font-size: 14px;
      visibility: hidden; opacity: 0;
      transition: visibility 0s, opacity 0.3s linear;
    }
    #error-message.show { visibility: visible; opacity: 1; }
    
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <i class="fas fa-hospital-user"></i>
      <h2>ระบบติดตามเยี่ยมผู้ป่วย Heal&Home</h2>
    </div>
    <form id="login-form">
      <div class="input-group">
        <input type="text" id="username" class="input-field" placeholder="ชื่อผู้ใช้" required>
        <i class="fas fa-user"></i>
      </div>
      <div class="input-group">
        <input type="password" id="password" class="input-field" placeholder="รหัสผ่าน" required>
        <i class="fas fa-lock"></i>
      </div>
      <button type="submit" class="btn-login" id="login-button">
        <span id="button-text">เข้าสู่ระบบ</span>
        <div id="button-spinner" class="spinner" style="display: none;"></div>
      </button>
      <div id="error-message"></div>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Auto-redirect if already logged in
        if (await supabaseClient.checkLogin()) {
            window.location.href = 'index.html';
        }
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const loginButton = document.getElementById('login-button');
      const buttonText = document.getElementById('button-text');
      const buttonSpinner = document.getElementById('button-spinner');
      const errorMessageDiv = document.getElementById('error-message');

      // แสดง Spinner และปิดการใช้งานปุ่ม
      loginButton.disabled = true;
      buttonText.style.display = 'none';
      buttonSpinner.style.display = 'block';
      errorMessageDiv.classList.remove('show');

      try {
        const response = await supabaseClient.login(username, password);
        
        if (response.success) {
          window.location.href = 'index.html';
        } else {
          errorMessageDiv.textContent = response.message;
          errorMessageDiv.classList.add('show');
          resetButton();
        }
      } catch (error) {
        errorMessageDiv.textContent = 'เกิดข้อผิดพลาด: ' + error.message;
        errorMessageDiv.classList.add('show');
        resetButton();
      }
    });

    function resetButton() {
      const loginButton = document.getElementById('login-button');
      const buttonText = document.getElementById('button-text');
      const buttonSpinner = document.getElementById('button-spinner');
      
      loginButton.disabled = false;
      buttonText.style.display = 'inline';
      buttonSpinner.style.display = 'none';
    }
  </script>

</body>
</html>
